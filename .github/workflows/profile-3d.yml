name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate 3D profile
        run: |
          npm install -g github-profile-3d-contrib
          github-profile-3d-contrib --username ${{ github.repository_owner }} --output profile-3d-contrib
      - name: Commit & push to output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git commit -m "chore: refresh 3D profile" || echo "no changes"
          git push
